<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad1)"/>
  <!-- Circuit Grid Lines -->
  <path d="M 50 100 L 120 100 L 150 140 M 350 100 L 280 100 L 250 140 M 80 300 L 140 300 L 160 270 M 320 300 L 260 300 L 240 270" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <circle cx="150" cy="140" r="3" fill="#06b6d4"/>
  <circle cx="250" cy="140" r="3" fill="#06b6d4"/>
  
  <!-- Outer HUD Ring -->
  <circle cx="200" cy="200" r="170" stroke="#eab308" stroke-width="2" stroke-dasharray="10 15" stroke-opacity="0.5" fill="none"/>
  <circle cx="200" cy="200" r="185" stroke="#06b6d4" stroke-width="1" stroke-dasharray="40 8 10 8" stroke-opacity="0.3" fill="none"/>

  <!-- Neck & Shoulders -->
  <path d="M 140 340 L 160 280 L 240 280 L 260 340 L 320 380 L 80 380 Z" fill="#1e293b" stroke="url(#goldPlate)" stroke-width="2"/>
  <rect x="185" y="295" width="30" height="35" rx="6" fill="#06b6d4" filter="url(#cyanGlow)" opacity="0.8"/>
  
  <!-- Robot Head Base -->
  <path d="M 130 150 C 130 90 270 90 270 150 C 270 230 250 270 200 270 C 150 270 130 230 130 150 Z" fill="#0f172a" stroke="url(#goldPlate)" stroke-width="4"/>
  <!-- Gold Face Plates -->
  <path d="M 145 140 C 145 100 255 100 255 140 L 245 200 L 225 240 L 175 240 L 155 200 Z" fill="url(#goldPlate)" opacity="0.95"/>
  <path d="M 170 120 L 230 120 L 220 180 L 180 180 Z" fill="#0f172a"/>
  
  <!-- Cyan Glowing Eyes -->
  <ellipse cx="175" cy="155" rx="14" ry="7" fill="#06b6d4" filter="url(#cyanGlow)"/>
  <ellipse cx="225" cy="155" rx="14" ry="7" fill="#06b6d4" filter="url(#cyanGlow)"/>
  <ellipse cx="175" cy="155" rx="6" ry="3" fill="#ffffff"/>
  <ellipse cx="225" cy="155" rx="6" ry="3" fill="#ffffff"/>

  <!-- Forehead Circuit Arc -->
  <circle cx="200" cy="115" r="10" stroke="#06b6d4" stroke-width="2" fill="none" filter="url(#cyanGlow)"/>
  <line x1="200" y1="105" x2="200" y2="90" stroke="#06b6d4" stroke-width="2"/>

  <!-- Mouth / Voice Visualizer Grill -->
  <line x1="185" y1="215" x2="215" y2="215" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <line x1="190" y1="222" x2="210" y2="222" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
</svg>
