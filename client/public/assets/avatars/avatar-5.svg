<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="crimsonPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad5)"/>
  <!-- Cyber Circuit Geometry -->
  <g stroke="#f43f5e" stroke-width="1.5" opacity="0.4" fill="none">
    <polygon points="200,30 370,120 370,280 200,370 30,280 30,120" stroke-dasharray="8 6"/>
    <circle cx="200" cy="200" r="170" stroke-dasharray="25 10"/>
    <line x1="60" y1="200" x2="120" y2="200"/>
    <line x1="280" y1="200" x2="340" y2="200"/>
  </g>

  <!-- Neck & Shoulders -->
  <path d="M 145 330 L 165 270 L 235 270 L 255 330 L 310 380 L 90 380 Z" fill="#18181b" stroke="url(#crimsonPlate)" stroke-width="2"/>
  <circle cx="200" cy="305" r="10" fill="#f43f5e" filter="url(#crimsonGlow)"/>

  <!-- Helmet / Jester Crown Crest -->
  <path d="M 130 140 L 110 70 L 150 100 L 200 50 L 250 100 L 290 70 L 270 140 Z" fill="#27272a" stroke="url(#crimsonPlate)" stroke-width="3"/>
  <circle cx="110" cy="70" r="5" fill="#f43f5e" filter="url(#crimsonGlow)"/>
  <circle cx="200" cy="50" r="6" fill="#fb7185" filter="url(#crimsonGlow)"/>
  <circle cx="290" cy="70" r="5" fill="#f43f5e" filter="url(#crimsonGlow)"/>

  <!-- Main Cyber Mask Base -->
  <path d="M 135 140 C 135 90 265 90 265 140 C 265 220 245 260 200 260 C 155 260 135 220 135 140 Z" fill="#09090b" stroke="url(#crimsonPlate)" stroke-width="4"/>

  <!-- Sarcastic / Smirking Cyber Optical Eyes -->
  <path d="M 155 145 Q 175 135 185 150" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#crimsonGlow)"/>
  <circle cx="170" cy="148" r="4" fill="#ffffff"/>
  
  <path d="M 215 150 Q 225 135 245 145" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#crimsonGlow)"/>
  <circle cx="230" cy="148" r="4" fill="#ffffff"/>

  <!-- Smirk / Grin Line -->
  <path d="M 175 210 Q 205 230 225 205" stroke="#fb7185" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#crimsonGlow)"/>
</svg>
