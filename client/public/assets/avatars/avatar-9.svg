<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="indigoGlow9" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad9)"/>
  
  <!-- Constellation Circuit Lines -->
  <circle cx="80" cy="80" r="3" fill="#a5b4fc" filter="url(#indigoGlow9)"/>
  <circle cx="320" cy="80" r="3" fill="#a5b4fc" filter="url(#indigoGlow9)"/>
  <circle cx="60" cy="240" r="2.5" fill="#6366f1"/>
  <circle cx="340" cy="240" r="2.5" fill="#6366f1"/>
  <line x1="80" y1="80" x2="150" y2="130" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="320" y1="80" x2="250" y2="130" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="60" y1="240" x2="140" y2="280" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="340" y1="240" x2="260" y2="280" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Orbital Ring -->
  <ellipse cx="200" cy="200" rx="170" ry="70" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="30 10 5 10" transform="rotate(-25 200 200)" fill="none" opacity="0.6"/>

  <!-- Neck & Base -->
  <path d="M 140 335 L 165 270 L 235 270 L 260 335 L 320 380 L 80 380 Z" fill="#312e81" stroke="url(#indigoGrad)" stroke-width="2.5"/>
  <circle cx="200" cy="305" r="12" fill="#6366f1" filter="url(#indigoGlow9)"/>
  <circle cx="200" cy="305" r="5" fill="#ffffff"/>

  <!-- Angular Celestial Helmet -->
  <polygon points="200,75 275,130 250,250 200,280 150,250 125,130" fill="#0f172a" stroke="url(#indigoGrad)" stroke-width="3.5"/>
  
  <!-- Faceplate Visor Frame -->
  <polygon points="200,120 250,150 235,230 200,250 165,230 150,150" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>

  <!-- Glowing Indigo Diamond Eyes -->
  <polygon points="175,160 185,170 175,180 165,170" fill="#a5b4fc" filter="url(#indigoGlow9)"/>
  <polygon points="225,160 235,170 225,180 215,170" fill="#a5b4fc" filter="url(#indigoGlow9)"/>
  <circle cx="175" cy="170" r="2.5" fill="#ffffff"/>
  <circle cx="225" cy="170" r="2.5" fill="#ffffff"/>

  <!-- Forehead Third-Eye Sensor -->
  <polygon points="200,95 210,110 200,125 190,110" fill="#6366f1" filter="url(#indigoGlow9)"/>
  <circle cx="200" cy="110" r="3" fill="#ffffff"/>
</svg>
