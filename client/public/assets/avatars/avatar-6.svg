<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="orangePlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad6)"/>

  <!-- Military HUD Targeting Matrix -->
  <g stroke="#f97316" stroke-width="1.5" opacity="0.4" fill="none">
    <circle cx="200" cy="200" r="175" stroke-dasharray="30 8 4 8"/>
    <circle cx="200" cy="200" r="150" stroke-dasharray="10 20"/>
    <line x1="200" y1="20" x2="200" y2="70"/>
    <line x1="200" y1="330" x2="200" y2="380"/>
    <line x1="20" y1="200" x2="70" y2="200"/>
    <line x1="330" y1="200" x2="380" y2="200"/>
    <polygon points="190,25 210,25 200,40" fill="#f97316"/>
  </g>

  <!-- Heavy Armored Shoulders & Neck -->
  <path d="M 130 340 L 155 265 L 245 265 L 270 340 L 330 380 L 70 380 Z" fill="#1c1917" stroke="url(#orangePlate)" stroke-width="3"/>
  <polygon points="180,285 220,285 200,325" fill="#ea580c" filter="url(#orangeGlow)"/>

  <!-- Spartan / Tactical Commander Helmet Base -->
  <path d="M 135 150 C 135 80 265 80 265 150 L 255 230 L 200 270 L 145 230 Z" fill="#0c0a09" stroke="url(#orangePlate)" stroke-width="4"/>

  <!-- Central Crest Fin -->
  <path d="M 195 40 L 205 40 L 208 120 L 192 120 Z" fill="url(#orangePlate)" filter="url(#orangeGlow)"/>

  <!-- T-Shaped Glowing Visor Sensor -->
  <path d="M 155 140 L 245 140 L 245 155 L 210 155 L 210 225 L 190 225 L 190 155 L 155 155 Z" fill="#fb923c" filter="url(#orangeGlow)"/>
  <rect x="195" y="145" width="10" height="70" fill="#ffffff" opacity="0.8"/>
  <rect x="165" y="145" width="70" height="6" fill="#ffffff" opacity="0.8"/>

  <!-- Armor Vent Details -->
  <line x1="150" y1="200" x2="175" y2="220" stroke="#f97316" stroke-width="2"/>
  <line x1="250" y1="200" x2="225" y2="220" stroke="#f97316" stroke-width="2"/>
</svg>
