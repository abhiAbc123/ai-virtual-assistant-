<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="cyberPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad4)"/>

  <!-- City Bokeh Circles in Background -->
  <circle cx="90" cy="80" r="30" fill="#f59e0b" opacity="0.25"/>
  <circle cx="310" cy="110" r="35" fill="#f43f5e" opacity="0.2"/>
  <circle cx="60" cy="240" r="40" fill="#06b6d4" opacity="0.15"/>
  <circle cx="340" cy="260" r="28" fill="#10b981" opacity="0.2"/>

  <!-- Cybernetic Hair & Hairpins -->
  <path d="M 120 180 C 100 80 160 40 200 40 C 240 40 300 80 280 180 C 290 140 295 100 270 70 C 230 45 170 45 130 70 Z" fill="#e2e8f0"/>
  <rect x="110" y="80" width="30" height="15" rx="4" fill="#f43f5e" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="260" y="80" width="30" height="15" rx="4" fill="#f43f5e" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Neck & Tech Choker with Cyan Screen -->
  <path d="M 165 250 L 155 350 L 245 350 L 235 250 Z" fill="url(#cyberPink)" stroke="#fb7185" stroke-width="2"/>
  <rect x="180" y="275" width="40" height="20" rx="5" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <!-- Choker LED Face -->
  <circle cx="193" cy="285" r="2" fill="#06b6d4" filter="url(#emeraldGlow)"/>
  <circle cx="207" cy="285" r="2" fill="#06b6d4" filter="url(#emeraldGlow)"/>
  <line x1="195" y1="290" x2="205" y2="290" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- Anime Cyber Face -->
  <path d="M 140 130 C 140 90 260 90 260 130 C 260 210 230 255 200 255 C 170 255 140 210 140 130 Z" fill="url(#skinTone)"/>

  <!-- Glowing Emerald Eyes -->
  <ellipse cx="170" cy="155" rx="14" ry="10" fill="#10b981" filter="url(#emeraldGlow)"/>
  <ellipse cx="230" cy="155" rx="14" ry="10" fill="#10b981" filter="url(#emeraldGlow)"/>
  <circle cx="170" cy="155" r="5" fill="#064e3b"/>
  <circle cx="230" cy="155" r="5" fill="#064e3b"/>
  <circle cx="173" cy="152" r="3" fill="#ffffff"/>
  <circle cx="233" cy="152" r="3" fill="#ffffff"/>

  <!-- Cheek Cyber Glowing Circuit Tattoos -->
  <path d="M 145 170 L 155 180 L 148 190 M 140 180 L 152 180" stroke="#38bdf8" stroke-width="2" fill="none" filter="url(#emeraldGlow)"/>
  <path d="M 255 170 L 245 180 L 252 190 M 260 180 L 248 180" stroke="#38bdf8" stroke-width="2" fill="none" filter="url(#emeraldGlow)"/>

  <!-- Lips & Nose -->
  <path d="M 198 175 L 202 182 L 197 185" stroke="#f43f5e" stroke-width="1.5" fill="none"/>
  <ellipse cx="200" cy="210" rx="10" ry="4" fill="#f43f5e"/>
</svg>
