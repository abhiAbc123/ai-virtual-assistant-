<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="neonGlow7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad7)"/>
  
  <!-- Outer HUD Ring & Crosshairs -->
  <circle cx="200" cy="200" r="175" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="20 10 5 10" stroke-opacity="0.5" fill="none"/>
  <circle cx="200" cy="200" r="155" stroke="#38bdf8" stroke-width="1" stroke-dasharray="60 15 2 15" stroke-opacity="0.3" fill="none"/>
  <line x1="200" y1="20" x2="200" y2="50" stroke="#06b6d4" stroke-width="2"/>
  <line x1="200" y1="350" x2="200" y2="380" stroke="#06b6d4" stroke-width="2"/>
  <line x1="20" y1="200" x2="50" y2="200" stroke="#06b6d4" stroke-width="2"/>
  <line x1="350" y1="200" x2="380" y2="200" stroke="#06b6d4" stroke-width="2"/>

  <!-- Neck & Chassis -->
  <path d="M 135 340 L 160 270 L 240 270 L 265 340 L 330 385 L 70 385 Z" fill="#0c4a6e" stroke="url(#neonCyan)" stroke-width="2.5"/>
  <polygon points="175,290 225,290 215,340 185,340" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" filter="url(#neonGlow7)"/>

  <!-- Sleek Cyber Helmet Base -->
  <polygon points="200,85 270,140 255,240 200,275 145,240 130,140" fill="#0f172a" stroke="url(#neonCyan)" stroke-width="3.5"/>
  
  <!-- Sleek Neon Visor -->
  <path d="M 140 155 L 200 135 L 260 155 L 250 195 L 200 215 L 150 195 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlow7)" opacity="0.9"/>
  <path d="M 155 165 L 200 150 L 245 165 L 240 185 L 200 200 L 160 185 Z" fill="#38bdf8" filter="url(#neonGlow7)"/>
  
  <!-- Central Pulse Beam -->
  <line x1="170" y1="175" x2="230" y2="175" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow7)"/>

  <!-- Cheek Armor Plates -->
  <polygon points="145,210 175,225 165,245 140,230" fill="url(#neonCyan)" opacity="0.8"/>
  <polygon points="255,210 225,225 235,245 260,230" fill="url(#neonCyan)" opacity="0.8"/>

  <!-- Forehead Sensor Array -->
  <circle cx="200" cy="110" r="6" fill="#38bdf8" filter="url(#neonGlow7)"/>
  <circle cx="200" cy="110" r="2.5" fill="#ffffff"/>
  <line x1="180" y1="110" x2="190" y2="110" stroke="#06b6d4" stroke-width="2"/>
  <line x1="210" y1="110" x2="220" y2="110" stroke="#06b6d4" stroke-width="2"/>
</svg>
